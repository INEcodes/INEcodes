<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" role="img" aria-label="Abhay Singh Chauhan, AI and ML engineer">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F5FF"/>
      <stop offset="0.5" stop-color="#7B2FF7"/>
      <stop offset="1" stop-color="#FF2E97"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7B2FF7" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#7B2FF7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00F5FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#00F5FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF2E97" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FF2E97" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="gridmask"><rect y="190" width="1200" height="130" fill="url(#fade)"/></mask>
    <pattern id="grid" width="60" height="30" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V30" fill="none" stroke="#00F5FF" stroke-opacity="0.22" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="320" rx="22"/></clipPath>
    <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <style>
    .hue { animation: hue 14s linear infinite; }
    @keyframes hue { to { filter: hue-rotate(360deg); } }
    .drift1 { animation: d1 11s ease-in-out infinite alternate; }
    .drift2 { animation: d2 13s ease-in-out infinite alternate; }
    .drift3 { animation: d3 9s ease-in-out infinite alternate; }
    @keyframes d1 { to { transform: translate(140px, 30px); } }
    @keyframes d2 { to { transform: translate(-160px, -20px); } }
    @keyframes d3 { to { transform: translate(60px, -40px); } }
    .scan { animation: scan 6s linear infinite; }
    @keyframes scan { from { transform: translateY(-20px); } to { transform: translateY(340px); } }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .name { font: 800 68px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; letter-spacing: 3px; }
    .sub { font: 500 21px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 5px; }
    .tag { font: 500 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 3px; }
  </style>
  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="#05060F"/>
    <g class="hue">
      <g class="drift1"><circle cx="220" cy="90" r="260" fill="url(#glowA)"/></g>
      <g class="drift2"><circle cx="980" cy="230" r="280" fill="url(#glowB)"/></g>
      <g class="drift3"><circle cx="640" cy="330" r="220" fill="url(#glowC)"/></g>
      <rect y="190" width="1200" height="130" fill="url(#grid)" mask="url(#gridmask)"/>
      <rect class="scan" width="1200" height="2" fill="url(#neon)" opacity="0.5"/>
      <text x="600" y="150" text-anchor="middle" class="name" fill="url(#neon)" filter="url(#blur)" opacity="0.7">ABHAY SINGH CHAUHAN</text>
      <rect x="430" y="178" width="340" height="2" fill="url(#neon)"/>
      <rect x="0" y="316" width="1200" height="4" fill="url(#neon)"/>
    </g>
    <text x="600" y="150" text-anchor="middle" class="name" fill="#FFFFFF">ABHAY SINGH CHAUHAN</text>
    <text x="600" y="218" text-anchor="middle" class="sub" fill="#C9D6FF">AI / ML ENGINEER<tspan class="cursor" fill="#00F5FF"> _</tspan></text>
    <text x="40" y="44" class="tag" fill="#00F5FF" opacity="0.8">// INEcodes</text>
    <text x="1160" y="44" text-anchor="end" class="tag" fill="#FF2E97" opacity="0.8">SYS.ONLINE</text>
  </g>
</svg>
